<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bütçe & Net Varlık Takibi</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Uygulama Özel CSS -->
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-purple-500/30 selection:text-purple-200">

  <!-- Ana Uygulama Kapsayıcısı -->
  <div id="app" class="flex flex-col min-h-screen">
    <!-- Yükleniyor / İçerik buraya dinamik render edilir -->
    <div class="flex-1 flex items-center justify-center p-8">
      <div class="text-center space-y-3">
        <div class="w-10 h-10 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-slate-400 font-medium text-sm">Bütçe Paneli Yükleniyor...</p>
      </div>
    </div>
  </div>

  <!-- Modal Alanı -->
  <div id="modal-root"></div>

  <!-- Gizli Dosya Girişi (Yedek JSON yükleme için) -->
  <input type="file" id="backup-file-input" accept=".json" class="hidden">

  <!-- Ana Modül -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
